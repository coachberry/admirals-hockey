<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAleQHLvA75qr5a-bAuIZKCUyGiZ8jTJbE",
    authDomain: "admirals-hockey.firebaseapp.com",
    projectId: "admirals-hockey",
    storageBucket: "admirals-hockey.firebasestorage.app",
    messagingSenderId: "783358659334",
    appId: "1:783358659334:web:5daffd093adca386faec87"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const FRANKLIN_NAME = 'Franklin';

  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link').forEach(link => {
    const href = link.getAttribute('href').split('/').pop() || 'index.html';
    if (href === currentPage) link.classList.add('active');
  });

  function formatGameDate(dateStr) {
    return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  // ============================================
  // STANDINGS COMPUTATION
  // ============================================
  function computeStandings(games) {
    const played = games.filter(g => g.played && g.visitorScore !== null && g.visitorScore !== undefined && g.homeScore !== null && g.homeScore !== undefined);
    const teams = {};

    function ensureTeam(name) {
      if (!teams[name]) teams[name] = { name, gp:0, w:0, l:0, t:0, gf:0, ga:0, results: [] };
      return teams[name];
    }

    // Every team that appears anywhere shows up, even with 0 games played so far.
    games.forEach(g => { ensureTeam(g.visitorTeam); ensureTeam(g.homeTeam); });

    const sortedPlayed = [...played].sort((a, b) => a.date.localeCompare(b.date) || (a.order - b.order));

    sortedPlayed.forEach(g => {
      const v = ensureTeam(g.visitorTeam);
      const h = ensureTeam(g.homeTeam);
      v.gp++; h.gp++;
      v.gf += g.visitorScore; v.ga += g.homeScore;
      h.gf += g.homeScore; h.ga += g.visitorScore;
      // Tiebreak-only accumulator: each game's differential capped at +/-6 before
      // summing, so one blowout can't dominate the standings order. The displayed
      // DIFF column (t.diff, below) stays the true, uncapped total.
      const vGameDiff = g.visitorScore - g.homeScore;
      v.tiebreakDiff = (v.tiebreakDiff || 0) + Math.max(-6, Math.min(6, vGameDiff));
      h.tiebreakDiff = (h.tiebreakDiff || 0) + Math.max(-6, Math.min(6, -vGameDiff));
      if (g.visitorScore > g.homeScore) {
        v.w++; h.l++; v.results.push('W'); h.results.push('L');
      } else if (g.visitorScore < g.homeScore) {
        h.w++; v.l++; h.results.push('W'); v.results.push('L');
      } else {
        v.t++; h.t++; v.results.push('T'); h.results.push('T');
      }
    });

    const list = Object.values(teams).map(t => {
      t.pts = t.w * 2 + t.t * 1;
      t.diff = t.gf - t.ga;
      t.tiebreakDiff = t.tiebreakDiff || 0;
      let streakType = null, streakCount = 0;
      for (let i = t.results.length - 1; i >= 0; i--) {
        const r = t.results[i];
        if (streakType === null) { streakType = r; streakCount = 1; }
        else if (r === streakType) { streakCount++; }
        else break;
      }
      t.streakLabel = streakType ? (streakType === 'W' ? 'Won ' : streakType === 'L' ? 'Lost ' : 'Tied ') + streakCount : '-';
      return t;
    });

    // Resolves a group of teams already tied on points+wins using a mini-standings
    // computed ONLY from games played among that group's own members (the standard
    // multi-team tiebreak approach) — falling through to goal differential, then
    // fewest goals allowed, if the mini head-to-head still doesn't fully resolve it.
    function resolveTiedGroup(group) {
      if (group.length <= 1) return group;
      const namesInGroup = new Set(group.map(t => t.name));
      const miniWins = {};
      group.forEach(t => { miniWins[t.name] = 0; });
      sortedPlayed.forEach(g => {
        if (!namesInGroup.has(g.visitorTeam) || !namesInGroup.has(g.homeTeam)) return;
        if (g.visitorScore === g.homeScore) return; // a tie among the group grants no mini-win
        const winner = g.visitorScore > g.homeScore ? g.visitorTeam : g.homeTeam;
        miniWins[winner]++;
      });
      return [...group].sort((a, b) => {
        if (miniWins[b.name] !== miniWins[a.name]) return miniWins[b.name] - miniWins[a.name];
        if (b.tiebreakDiff !== a.tiebreakDiff) return b.tiebreakDiff - a.tiebreakDiff;
        return a.ga - b.ga;
      });
    }

    // Pass 1: sort strictly by points, then total wins, then GP (more games played
    // ranks higher) — nothing else yet.
    list.sort((a, b) => {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.w !== a.w) return b.w - a.w;
      return b.gp - a.gp;
    });

    // Pass 2: walk the points+wins+GP-sorted list, cluster consecutive teams still
    // tied on all three, and resolve each cluster with its own mini-standings.
    const finalList = [];
    let i = 0;
    while (i < list.length) {
      let j = i + 1;
      while (j < list.length && list[j].pts === list[i].pts && list[j].w === list[i].w && list[j].gp === list[i].gp) j++;
      finalList.push(...resolveTiedGroup(list.slice(i, j)));
      i = j;
    }

    return finalList;
  }

  function renderStandings(list) {
    const body = document.getElementById('standingsBody');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="11" style="padding:1rem;text-align:center;color:#999;">No standings data yet.</td></tr>';
      return;
    }
    const rows = list.map((t, i) => {
      const isFranklin = t.name === FRANKLIN_NAME;
      const diffColor = t.diff > 0 ? '#2e7d32' : t.diff < 0 ? '#c62828' : '#333';
      const diffLabel = t.diff > 0 ? '+' + t.diff : String(t.diff);
      return `<tr style="${isFranklin ? 'background:#fdf0f1;font-weight:700;' : ''}border-bottom:1px solid #eee;">
        <td style="padding:0.5rem;">${i + 1}</td>
        <td style="padding:0.5rem;">${t.name}</td>
        <td style="padding:0.5rem;text-align:center;">${t.gp}</td>
        <td style="padding:0.5rem;text-align:center;">${t.w}</td>
        <td style="padding:0.5rem;text-align:center;">${t.l}</td>
        <td style="padding:0.5rem;text-align:center;">${t.t}</td>
        <td style="padding:0.5rem;text-align:center;">${t.pts}</td>
        <td style="padding:0.5rem;text-align:center;">${t.gf}</td>
        <td style="padding:0.5rem;text-align:center;">${t.ga}</td>
        <td style="padding:0.5rem;text-align:center;color:${diffColor};">${diffLabel}</td>
        <td style="padding:0.5rem;text-align:center;">${t.streakLabel}</td>
      </tr>`;
    });

    // Permanent end-of-season tournament cutoff: if the season ended today,
    // ranks 1-8 play in the Preds Cup and ranks 9+ play in the Hine Cup.
    if (rows.length > 8) {
      rows.splice(8, 0, `<tr><td colspan="11" style="padding:0;border:0;">
        <div style="background:#5D1725;color:white;font-weight:700;font-size:0.72rem;letter-spacing:0.04em;text-align:center;padding:0.4rem 0.5rem;text-transform:uppercase;">
          ▲ Preds Cup &nbsp;&nbsp;|&nbsp;&nbsp; Hine Cup ▼
        </div>
      </td></tr>`);
    }

    body.innerHTML = rows.join('');
  }

  // ============================================
  // ALL GAMES LIST
  // ============================================
  function renderAllGames(games) {
    const body = document.getElementById('allGamesBody');
    if (!games.length) {
      body.innerHTML = '<tr><td colspan="6" style="padding:1rem;text-align:center;color:#999;">No games yet.</td></tr>';
      return;
    }
    const sorted = [...games].sort((a, b) => a.date.localeCompare(b.date) || (a.order - b.order));
    body.innerHTML = sorted.map(g => {
      const isFranklinGame = g.isFranklinGame;
      const vScore = g.played ? g.visitorScore : '';
      const hScore = g.played ? g.homeScore : '';
      return `<tr style="${isFranklinGame ? 'background:#fdf0f1;' : ''}border-bottom:1px solid #eee;">
        <td style="padding:0.5rem;white-space:nowrap;">${formatGameDate(g.date)}</td>
        <td style="padding:0.5rem;">${g.visitorTeam}</td>
        <td style="padding:0.5rem;text-align:center;font-weight:700;">${vScore}</td>
        <td style="padding:0.5rem;text-align:center;color:#999;">@</td>
        <td style="padding:0.5rem;">${g.homeTeam}</td>
        <td style="padding:0.5rem;text-align:center;font-weight:700;">${hScore}</td>
      </tr>`;
    }).join('');
  }

  // ============================================
  // LOAD
  // ============================================
  async function loadStandingsPage() {
    try {
      const snap = await getDocs(query(collection(db, 'leagueGames'), orderBy('order')));
      const games = [];
      snap.forEach(d => games.push({ id: d.id, ...d.data() }));
      renderStandings(computeStandings(games));
      renderAllGames(games);
    } catch (e) {
      console.error('Error loading standings:', e);
      document.getElementById('standingsBody').innerHTML = '<tr><td colspan="11" style="padding:1rem;text-align:center;color:#c62828;">Error loading standings.</td></tr>';
      document.getElementById('allGamesBody').innerHTML = '<tr><td colspan="6" style="padding:1rem;text-align:center;color:#c62828;">Error loading games.</td></tr>';
    }
  }

  loadStandingsPage();

  // Mobile nav toggle
  (function() {
    var btn = document.getElementById('navToggle');
    var nav = document.getElementById('navLinks');
    if (!btn || !nav) return;
    btn.addEventListener('click', function() {
      btn.classList.toggle('open');
      nav.classList.toggle('open');
    });
    nav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        btn.classList.remove('open');
        nav.classList.remove('open');
      });
    });
  })();
</script>
