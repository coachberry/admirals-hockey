<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Franklin Admirals Hockey</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-container">
  <div class="login-box">
    <h1>⚓ Franklin Admirals</h1>
    <h2>Admin Portal</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="dashboard" class="admin-dashboard" style="display: none;">
  <div class="admin-header">
    <h1>Admin Dashboard</h1>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="admin-tabs">
    <button class="tab-btn active" data-tab="roster">Roster</button>
    <button class="tab-btn" data-tab="schedule">Schedule</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
    <button class="tab-btn" data-tab="news">News</button>
  </div>

  <div class="admin-content">

    <!-- ROSTER TAB -->
    <div id="rosterTab" class="tab-content active">
      <h2>Team Roster</h2>
      <button id="addPlayerBtn" class="btn">+ Add Player</button>
      
      <div id="playerForm" class="form-section" style="display: none;">
        <h3>Add/Edit Player</h3>
        <input type="hidden" id="playerId">
        <input type="text" id="playerName" placeholder="Player Name" required>
        <input type="number" id="playerNumber" placeholder="Jersey Number" required>
        <select id="playerPosition" required>
          <option value="">Position</option>
          <option value="Forward">Forward</option>
          <option value="Defense">Defense</option>
          <option value="Goaltender">Goaltender</option>
        </select>
        <select id="playerGrade" required>
          <option value="">Grade</option>
          <option value="Senior">Senior</option>
          <option value="Junior">Junior</option>
          <option value="Sophomore">Sophomore</option>
          <option value="Freshman">Freshman</option>
        </select>
        <div class="form-buttons">
          <button type="button" id="savePlayerBtn" class="btn btn-primary">Save</button>
          <button type="button" id="cancelPlayerBtn" class="btn">Cancel</button>
        </div>
      </div>

      <div id="playersList" class="items-list"></div>
    </div>

    <!-- SCHEDULE TAB -->
    <div id="scheduleTab" class="tab-content">
      <h2>Game Schedule</h2>
      <button id="addGameBtn" class="btn">+ Add Game</button>
      
      <div id="gameForm" class="form-section" style="display: none;">
        <h3>Add/Edit Game</h3>
        <input type="hidden" id="gameId">
        <input type="date" id="gameDate" required>
        <input type="time" id="gameTime" required>
        <input type="text" id="gameOpponent" placeholder="Opponent" required>
        <select id="gameType" required>
          <option value="">Home or Away</option>
          <option value="Home">Home</option>
          <option value="Away">Away</option>
        </select>
        <input type="text" id="gameLocation" placeholder="Location" required>
        <div class="form-buttons">
          <button type="button" id="saveGameBtn" class="btn btn-primary">Save</button>
          <button type="button" id="cancelGameBtn" class="btn">Cancel</button>
        </div>
      </div>

      <div id="gamesList" class="items-list"></div>
    </div>

    <!-- STATS TAB -->
    <div id="statsTab" class="tab-content">
      <h2>Team Statistics</h2>
      <div class="stats-section">
        <h3>Season Record</h3>
        <input type="number" id="wins" placeholder="Wins" min="0">
        <input type="number" id="losses" placeholder="Losses" min="0">
        <input type="number" id="ties" placeholder="Ties" min="0">
        <button id="saveStatsBtn" class="btn btn-primary">Save Stats</button>
      </div>
    </div>

    <!-- NEWS TAB -->
    <div id="newsTab" class="tab-content">
      <h2>News & Updates</h2>
      <button id="addNewsBtn" class="btn">+ Add Post</button>
      
      <div id="newsForm" class="form-section" style="display: none;">
        <h3>Add/Edit News Post</h3>
        <input type="hidden" id="newsId">
        <input type="text" id="newsTitle" placeholder="Title" required>
        <input type="date" id="newsDate" required>
        <select id="newsCategory" required>
          <option value="">Category</option>
          <option value="Game Report">Game Report</option>
          <option value="Team Update">Team Update</option>
          <option value="Announcement">Announcement</option>
        </select>
        <textarea id="newsContent" placeholder="Content" rows="5" required></textarea>
        <div class="form-buttons">
          <button type="button" id="saveNewsBtn" class="btn btn-primary">Save</button>
          <button type="button" id="cancelNewsBtn" class="btn">Cancel</button>
        </div>
      </div>

      <div id="newsList" class="items-list"></div>
    </div>

  </div>
</div>

<script src="/assets/js/admin.js"></script>
</body>
</html>
